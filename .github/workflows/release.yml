name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: swift test --package-path Packages/SwaprCore

      - name: Build and package
        run: ./scripts/build-release.sh

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Swapr-*.zip \
            --draft \
            --title "Swapr ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details. This build is ad-hoc signed: on first launch, Control-click Swapr.app and choose Open."
